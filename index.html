<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="予定">
<meta name="theme-color" content="#f6efe6">
<title>予定</title>
<style>
  :root {
    --bg: #f6efe6;
    --card: #fffaf3;
    --line: #eadfce;
    --text: #4a3f35;
    --sub: #9a8b7a;
    --accent: #c98b6b;
    --accent-soft: #f3e1d4;
    --sel: #f3e1d4;
    --dot: #d9776b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 80px;
  }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 17px; margin: 12px 0 8px; }
    h3 {
    font-size: 15px; margin: 16px 0 6px; padding-top: 14px;
    color: var(--accent); border-top: 2px solid #e2d3bd;
  }
  .card > h2 + h3, .card > h3:first-child {
    margin-top: 6px; padding-top: 0; border-top: 0;
  }
  h3 + .ex { border-top: 0; }
  .card {
    background: var(--card); border-radius: 16px; padding: 14px;
    margin-bottom: 12px; box-shadow: 0 2px 8px rgba(120, 90, 60, 0.08);
  }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; font-size: 12px; color: var(--sub); }
  .cell {
    background: var(--card); border-radius: 10px; min-height: 68px; padding: 4px 2px;
    font-size: 13px; position: relative; text-align: center; overflow: hidden;
  }
  .cell.today { border: 2px solid var(--accent); }
  .cell.sel { background: var(--sel); }
  .ev {
    font-size: 9px; line-height: 1.3; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 0 2px; text-align: left;
  }
  .ev.more { color: var(--sub); }

  /* スタンプ(〇) */
  .badge {
    display: flex; align-items: center; justify-content: center;
    margin: 2px auto 2px; width: 22px; height: 22px; border-radius: 50%;
    font-size: 12px; font-weight: bold; color: #fff;
    border: 2px solid transparent;
  }
  .badge.plan { background: none; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .legend .badge { display: inline-flex; margin: 0 2px 0 0; width: 18px; height: 18px; font-size: 10px; vertical-align: middle; }

  .dot {
    position: absolute; right: 4px; top: 4px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--dot);
  }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex;
    background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; padding: 14px 0; border: 0; background: none;
    font-size: 14px; color: var(--sub);
  }
  nav button.on { color: var(--accent); font-weight: bold; }
  input, textarea, select {
    font-size: 16px; padding: 8px; border: 1px solid var(--line);
    border-radius: 10px; max-width: 100%; background: #fff; color: var(--text);
  }
  input.n { width: 64px; text-align: center; }
  textarea { width: 100%; min-height: 140px; }
  button.p {
    background: var(--accent); color: #fff; border: 0;
    border-radius: 10px; padding: 10px 16px; font-size: 15px;
  }
  button.s {
    background: var(--accent-soft); color: var(--text); border: 0;
    border-radius: 10px; padding: 8px 12px; font-size: 14px;
  }
  button.pick {
    flex: 1; min-width: 64px; padding: 12px 8px; font-size: 16px;
    background: #fff; color: var(--text);
    border: 2px solid var(--line); border-radius: 12px;
  }
  .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .ex { border-top: 1px solid var(--line); padding: 8px 0; }
  .hint { font-size: 12px; color: var(--sub); }
  .up { font-size: 12px; color: var(--dot); }
  .done { text-decoration: line-through; color: var(--sub); }
  .sum-ex { font-size: 14px; margin: 2px 0; }

  /* 目標カウントダウン */
  .goal {
    background: var(--accent-soft); border-radius: 14px; padding: 10px 14px;
    margin-bottom: 8px; font-size: 15px;
  }
  .goal b { font-size: 24px; color: var(--accent); margin: 0 2px; }
  .goal .gd { font-size: 12px; color: var(--sub); margin-left: 6px; }

  /* 休憩タイマー */
  .timer {
    position: sticky; top: 8px; z-index: 10;
    background: var(--card); border: 2px solid var(--accent-soft);
    border-radius: 16px; padding: 12px; margin-bottom: 12px;
    box-shadow: 0 3px 10px rgba(120, 90, 60, 0.15);
  }
  .timer.running { border-color: var(--accent); }
  .timer.finished { background: #fbe3dc; border-color: var(--dot); }
  .tm-head { display: flex; justify-content: space-between; align-items: baseline; }
  .tm-label { font-size: 12px; color: var(--sub); }
  .tm-text { font-size: 34px; font-weight: bold; font-variant-numeric: tabular-nums; }
  .tm-track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 6px 0; }
  .tm-bar { height: 100%; width: 0; background: var(--accent); }
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const DOW = ['日', '月', '火', '水', '木', '金', '土'];

// ---------- データ ----------
const KEY = 'calendar-app-v1';
let db = JSON.parse(localStorage.getItem(KEY) || 'null')
  || { events: [], recurring: [], tasks: [], logs: {}, picks: {}, goals: [] };
if (!db.picks) db.picks = {};
if (!db.goals) db.goals = [];
const save = () => localStorage.setItem(KEY, JSON.stringify(db));

// ---------- 筋トレのメニュー定義 ----------
// label=ボタンの文字 / stamp=〇の中の文字(空なら無印の〇) / color=印の色 / rest=セット間休憩(秒)
// C・Dを足すときは、下のCのひな形のコメントを外して中身を書き換えます。
const TYPES = {
  P: {
    label: '調整', stamp: '', color: '#e0a566', title: '調整日(軽めプランク)',
    ex: [
      { id: 'plankL', name: '軽めプランク', w: 0, min: 20, max: 30, sets: 2, unit: '秒', hasW: false, rest: 60 }
    ]
  },
  A: {
    label: 'A', stamp: 'A', color: '#7aa3c7', title: 'Day A(大腿前部・プッシュ)',
    ex: [
      { id: 'squat', name: 'ゴブレットスクワット', w: 8, min: 8, max: 10, sets: 3, unit: '回', hasW: true, rest: 120 },
      { id: 'press', name: 'ダンベルプレス(片手)', w: 6, min: 8, max: 10, sets: 3, unit: '回', hasW: true, rest: 120 },
      { id: 'side', name: 'サイドレイズ(片手)', w: 2, min: 12, max: 15, sets: 3, unit: '回', hasW: true, rest: 90 },
      { id: 'plankH', name: 'プランク(高強度)', w: 0, min: 30, max: 45, sets: 3, unit: '秒', hasW: false, rest: 60 }
    ]
  },
  B: {
    label: 'B', stamp: 'B', color: '#7fb592', title: 'Day B(大腿後面・プル)',
    ex: [
      { id: 'rdl', name: 'ダンベルRDL(片手)', w: 6, min: 8, max: 10, sets: 3, unit: '回', hasW: true, rest: 120 },
      { id: 'row', name: 'ベントオーバーロー(片手)', w: 5, min: 8, max: 10, sets: 3, unit: '回', hasW: true, rest: 120 },
      { id: 'curl', name: 'アームカール(片手)', w: 4, min: 10, max: 12, sets: 3, unit: '回', hasW: true, rest: 90 },
      { id: 'crunch', name: 'クランチ', w: 0, min: 12, max: 15, sets: 3, unit: '回', hasW: false, rest: 60 }
    ]
  }
  // ,C: {
  //   label: 'C', stamp: 'C', color: '#b79ad0', title: 'Day C(ジム)',
  //   ex: [
  //     { id: 'c_bench', name: 'ベンチプレス', w: 20, min: 8, max: 10, sets: 3, unit: '回', hasW: true, rest: 120 }
  //   ]
  // }
};

// その日の筋トレの種類(記録があればそれを優先)
function typeOf(ds) {
  const log = db.logs[ds];
  const t = (log && log.type) || db.picks[ds] || '';
  return TYPES[t] ? t : '';
}

// カレンダー用のスタンプ(〇)
function stampHtml(ds) {
  const type = typeOf(ds);
  if (!type) return '';
  const t = TYPES[type];
  const txt = t.stamp ? esc(t.stamp) : '';
  if (db.logs[ds]) {
    return `<span class="badge" style="background:${t.color};border-color:${t.color}">${txt}</span>`;
  }
  return `<span class="badge plan" style="border-color:${t.color};color:${t.color}">${txt}</span>`;
}

function lastLog(type, exId, before) {
  const dates = Object.keys(db.logs).filter(d => d < before && db.logs[d].type === type).sort();
  for (let i = dates.length - 1; i >= 0; i--) {
    const e = db.logs[dates[i]].ex && db.logs[dates[i]].ex[exId];
    if (e) return e;
  }
  return null;
}
function lastDone(before) {
  const dates = Object.keys(db.logs).filter(d => d < before && TYPES[db.logs[d].type]).sort();
  if (!dates.length) return null;
  const d = dates[dates.length - 1];
  return { date: d, type: db.logs[d].type };
}

// ---------- 目標カウントダウン ----------
function daysLeft(ds) {
  return Math.round((parse(ds) - parse(ymd(new Date()))) / 86400000);
}
function renderGoals() {
  const list = db.goals.filter(g => daysLeft(g.date) >= 0)
    .sort((a, b) => a.date.localeCompare(b.date));
  if (!list.length) return '';
  return list.map(g => {
    const n = daysLeft(g.date);
    const msg = n === 0
      ? `${esc(g.title)}:<b>今日</b>が期限です`
      : `${esc(g.title)}まであと<b>${n}</b>日`;
    return `<div class="goal">${msg}<span class="gd">(${esc(g.date)})</span></div>`;
  }).join('');
}

// ---------- 休憩タイマー ----------
let timer = { running: false, done: false, end: 0, total: 0, label: '' };
let actx = null;
let wake = null;

function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function beep() {
  try {
    unlockAudio();
    [0, 0.3, 0.6].forEach(t => {
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.frequency.value = 880;
      g.gain.value = 0.15;
      o.connect(g);
      g.connect(actx.destination);
      o.start(actx.currentTime + t);
      o.stop(actx.currentTime + t + 0.18);
    });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
async function holdScreen() {
  try {
    if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen');
  } catch (e) {}
}
function releaseScreen() {
  try { if (wake) wake.release(); } catch (e) {}
  wake = null;
}
function startTimer(sec, label) {
  unlockAudio();
  holdScreen();
  timer = { running: true, done: false, end: Date.now() + sec * 1000, total: sec, label: label || '休憩' };
  updateTimer();
}
function stopTimer() {
  timer = { running: false, done: false, end: 0, total: 0, label: '' };
  releaseScreen();
  updateTimer();
}
function addTimer(sec) {
  if (!timer.running) return;
  timer.end += sec * 1000;
  timer.total += sec;
  updateTimer();
}
function fmt(sec) {
  const s = Math.max(0, Math.ceil(sec));
  return `${Math.floor(s / 60)}:${pad(s % 60)}`;
}
function renderTimerBox() {
  return '<div class="timer" id="timerBox">'
    + '<div class="tm-head"><span class="tm-label" id="tm-label"></span>'
    + '<span class="tm-text" id="tm-text">0:00</span></div>'
    + '<div class="tm-track"><div class="tm-bar" id="tm-bar"></div></div>'
    + '<div class="row">'
    + '<button class="s" onclick="startTimer(60,\'休憩\')">60秒</button>'
    + '<button class="s" onclick="startTimer(90,\'休憩\')">90秒</button>'
    + '<button class="s" onclick="startTimer(120,\'休憩\')">120秒</button>'
    + '<button class="s" onclick="addTimer(15)">+15秒</button>'
    + '<button class="s" onclick="stopTimer()">停止</button>'
    + '</div></div>';
}
function updateTimer() {
  const box = $('#timerBox');
  if (!box) return;
  const text = $('#tm-text');
  const bar = $('#tm-bar');
  const label = $('#tm-label');
  if (timer.running) {
    const remain = (timer.end - Date.now()) / 1000;
    if (remain <= 0) {
      timer.running = false;
      timer.done = true;
      releaseScreen();
      beep();
    } else {
      text.textContent = fmt(remain);
      label.textContent = '休憩中:' + timer.label;
      bar.style.width = (100 * remain / timer.total) + '%';
      box.className = 'timer running';
      return;
    }
  }
  if (timer.done) {
    text.textContent = '0:00';
    label.textContent = '休憩おわり。次のセットへどうぞ';
    bar.style.width = '0%';
    box.className = 'timer finished';
    return;
  }
  text.textContent = '0:00';
  label.textContent = '休憩タイマー(下のボタンで開始)';
  bar.style.width = '0%';
  box.className = 'timer';
}
setInterval(updateTimer, 250);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && timer.running) { holdScreen(); updateTimer(); }
});

// ---------- 予定の展開 ----------
function itemsOn(ds) {
  const dow = parse(ds).getDay();
  const events = db.events.filter(e => e.date === ds).map(e => ({ ...e, rec: false }));
  db.recurring.forEach(r => {
    if (!r.days.includes(dow)) return;
    if (r.from && ds < r.from) return;
    if (r.to && ds > r.to) return;
    events.push({ id: r.id, title: r.title, time: r.time, rec: true });
  });
  events.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  const tasks = db.tasks.filter(t => t.date === ds);
  return { events, tasks };
}

// ---------- 状態 ----------
const todayStr = ymd(new Date());
let state = { tab: 'today', month: new Date(), sel: todayStr, edit: false, preview: null, msg: '' };

function setTab(t) { state.tab = t; state.msg = ''; state.edit = false; render(); }
function moveMonth(n) {
  state.month = new Date(state.month.getFullYear(), state.month.getMonth() + n, 1);
  render();
}
function selectDate(ds) { state.sel = ds; state.edit = false; render(); }
function toggleEdit() { state.edit = !state.edit; render(); }

// ---------- 筋トレの選択 ----------
function pickType(ds, t) {
  const cur = typeOf(ds);
  const log = db.logs[ds];
  if (t === cur) t = '';
  if (log && log.type !== t) {
    if (!confirm('この日の記録は削除されます。変更しますか?')) return;
    delete db.logs[ds];
  }
  if (t) db.picks[ds] = t;
  else delete db.picks[ds];
  save();
  render();
}

// ---------- 日の表示(筋トレ入力部分) ----------
function renderWorkout(ds) {
  const type = typeOf(ds);
  const showTimer = state.tab === 'today';
  let h = '<h3>筋トレ</h3><div class="row">';
  Object.keys(TYPES).forEach(k => {
    const t = TYPES[k];
    const on = k === type;
    const style = on ? ` style="background:${t.color};border-color:${t.color};color:#fff"` : '';
    h += `<button class="pick${on ? ' on' : ''}"${style} onclick="pickType('${ds}','${k}')">${esc(t.label)}</button>`;
  });
  h += '</div>';

  const last = lastDone(ds);
  if (last) {
    h += `<div class="hint">前回の筋トレ:${esc(TYPES[last.type].label)}(${last.date.slice(5).replace('-', '/')})</div>`;
  }

  if (!type) {
    h += '<div class="hint">やる日は上のボタンを選んでください。選ばなければ休養日です。もう一度押すと選択を解除できます。</div>';
    return h;
  }

  h += `<h3>${esc(TYPES[type].title)}</h3>`;
  const log = db.logs[ds];
  TYPES[type].ex.forEach(ex => {
    const cur = log && log.ex && log.ex[ex.id];
    const prev = lastLog(type, ex.id, ds);
    const w = cur ? cur.w : (prev ? prev.w : ex.w);
    h += `<div class="ex"><b>${ex.name}</b> <span class="hint">${ex.sets}セット × ${ex.min}〜${ex.max}${ex.unit}</span>`;
    h += '<div class="row">';
    if (ex.hasW) {
      h += `<input class="n" id="w-${ex.id}" type="number" step="0.5" inputmode="decimal" value="${w}"> kg`;
    }
    for (let i = 0; i < ex.sets; i++) {
      const v = cur && cur.s[i] != null ? cur.s[i] : '';
      const ph = prev && prev.s[i] != null ? prev.s[i] : '';
      h += `<input class="n" id="s-${ex.id}-${i}" type="number" inputmode="numeric" value="${v}" placeholder="${ph}">`;
    }
    h += `<span class="hint">${ex.unit}</span></div>`;
    if (showTimer) {
      h += `<div class="row"><button class="s" onclick="startTimer(${ex.rest},'${ex.name}')">休憩 ${ex.rest}秒</button></div>`;
    }
    if (prev && prev.s.length >= ex.sets && prev.s.slice(0, ex.sets).every(x => Number(x) >= ex.max)) {
      h += '<div class="up">前回は全セットで上限に到達しました。フォームと余力に問題なければ、最小の刻みでの増量を検討してください。</div>';
    }
    h += '</div>';
  });
  h += `<div class="row"><input id="note" style="flex:1" placeholder="余力・フォーム・痛み・次回の調整" value="${esc(log && log.note || '')}"></div>`;
  h += `<div class="row"><button class="p" onclick="saveLog('${ds}')">記録を保存</button>`
    + (log ? ` <button class="s" onclick="delLog('${ds}')">記録を削除</button>` : '') + '</div>';
  return h;
}

// 予定・タスクの一覧部分
function renderItems(ds) {
  const { events, tasks } = itemsOn(ds);
  let h = '<h3>予定</h3>';
  if (!events.length) h += '<div class="hint">予定はありません</div>';
  events.forEach(e => {
    h += `<div class="row">${esc(e.time || '終日')} ${esc(e.title)}`
      + `${e.rec ? ' <span class="hint">(繰り返し)</span>' : ''}`
      + (e.rec ? '' : ` <button class="s" onclick="delEvent('${e.id}')">削除</button>`)
      + '</div>';
  });
  h += '<h3>今日やること</h3>';
  if (!tasks.length) h += '<div class="hint">タスクはありません</div>';
  tasks.forEach(t => {
    h += `<div class="row"><label class="${t.done ? 'done' : ''}">`
      + `<input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')"> `
      + `${esc(t.title)}${t.min ? `(${t.min}分)` : ''}</label>`
      + ` <button class="s" onclick="delTask('${t.id}')">削除</button></div>`;
  });
  return h;
}

// 「今日」タブ用:すべて表示
function renderDay(ds) {
  const d = parse(ds);
  return `<div class="card"><h2>${ds}(${DOW[d.getDay()]})</h2>`
    + renderItems(ds) + renderWorkout(ds) + '</div>';
}

// 「月」タブ用:その日の要約
function renderSummary(ds) {
  const d = parse(ds);
  const type = typeOf(ds);
  const log = db.logs[ds];
  let h = `<div class="card"><h2>${ds}(${DOW[d.getDay()]})</h2>`;
  h += renderItems(ds);

  h += '<h3>筋トレ</h3>';
  if (!type) {
    h += '<div class="hint">なし(休養日)</div>';
  } else {
    const t = TYPES[type];
    h += `<div class="row">${stampHtml(ds)}<b>${esc(t.label)}</b>`
      + `<span class="hint">${log ? '記録済み' : '選択済み(未記録)'}</span></div>`;
    if (log && log.ex) {
      t.ex.forEach(ex => {
        const e = log.ex[ex.id];
        if (!e) return;
        const reps = e.s.map(x => x == null ? '-' : x).join(' / ');
        h += `<div class="sum-ex">${ex.name}:${ex.hasW ? e.w + 'kg ' : ''}${reps}${ex.unit}</div>`;
      });
      if (log.note) h += `<div class="hint">メモ:${esc(log.note)}</div>`;
    }
  }
  h += `<div class="row"><button class="s" onclick="toggleEdit()">${state.edit ? '閉じる' : '筋トレを選ぶ・記録する'}</button></div>`;
  h += '</div>';
  if (state.edit) h += `<div class="card">${renderWorkout(ds)}</div>`;
  return h;
}

function saveLog(ds) {
  const type = typeOf(ds);
  if (!type) return;
  const ex = {};
  TYPES[type].ex.forEach(e => {
    const w = e.hasW ? Number($('#w-' + e.id).value) : 0;
    const s = [];
    for (let i = 0; i < e.sets; i++) {
      const v = $(`#s-${e.id}-${i}`).value;
      s.push(v === '' ? null : Number(v));
    }
    if (s.some(x => x != null)) ex[e.id] = { w, s };
  });
  if (!Object.keys(ex).length) { alert('回数を1つ以上入力してください'); return; }
  db.logs[ds] = { type, ex, note: $('#note').value };
  db.picks[ds] = type;
  save();
  render();
}
function delLog(ds) { if (confirm('この日の記録を削除しますか?')) { delete db.logs[ds]; save(); render(); } }
function toggleTask(id) { const t = db.tasks.find(x => x.id === id); t.done = !t.done; save(); render(); }
function delTask(id) { db.tasks = db.tasks.filter(x => x.id !== id); save(); render(); }
function delEvent(id) { db.events = db.events.filter(x => x.id !== id); save(); render(); }
function delRec(id) { db.recurring = db.recurring.filter(x => x.id !== id); save(); render(); }
function delGoal(id) { db.goals = db.goals.filter(x => x.id !== id); save(); render(); }

// ---------- 月表示 ----------
function renderMonth() {
  const y = state.month.getFullYear();
  const m = state.month.getMonth();
  const first = new Date(y, m, 1);
  const last = new Date(y, m + 1, 0);
  let h = `<div class="bar"><button class="s" onclick="moveMonth(-1)">‹</button>`
    + `<b>${y}年${m + 1}月</b><button class="s" onclick="moveMonth(1)">›</button></div><div class="grid">`;
  DOW.forEach(w => { h += `<div class="dow">${w}</div>`; });
  for (let i = 0; i < first.getDay(); i++) h += '<div></div>';
  for (let day = 1; day <= last.getDate(); day++) {
    const dt = new Date(y, m, day);
    const ds = ymd(dt);
    const it = itemsOn(ds);
    const titles = it.events.map(e => e.title).concat(it.tasks.map(t => t.title));
    let evs = '';
    if (titles.length) evs += `<div class="ev">${esc(titles[0])}</div>`;
    if (titles.length > 1) evs += `<div class="ev more">ほか${titles.length - 1}件</div>`;
    const dot = titles.length ? '<i class="dot"></i>' : '';
    h += `<div class="cell ${ds === todayStr ? 'today' : ''} ${ds === state.sel ? 'sel' : ''}" `
      + `onclick="selectDate('${ds}')"><span>${day}</span>${stampHtml(ds)}${evs}${dot}</div>`;
  }
  h += '</div>';

  // 凡例
  h += '<div class="legend hint">';
  Object.keys(TYPES).forEach(k => {
    const t = TYPES[k];
    h += `<span><span class="badge" style="background:${t.color};border-color:${t.color}">${esc(t.stamp)}</span>${esc(t.label)}</span>`;
  });
  h += '<span>塗りつぶし=記録済み / 枠のみ=未記録</span></div>';

  return h + renderSummary(state.sel);
}

// ---------- 追加 ----------
function renderAdd() {
  let h = '<div class="card"><h2>目標と期限</h2>'
    + `<div class="row"><input id="g-title" placeholder="目標(例:資格試験)" style="flex:1"></div>`
    + `<div class="row"><input id="g-date" type="date"></div>`
    + '<button class="p" onclick="addGoal()">追加</button>';
  const goals = db.goals.slice().sort((a, b) => a.date.localeCompare(b.date));
  if (!goals.length) h += '<div class="hint" style="margin-top:8px">まだありません</div>';
  goals.forEach(g => {
    const n = daysLeft(g.date);
    const st = n > 0 ? `あと${n}日` : (n === 0 ? '今日' : '期限切れ');
    h += `<div class="row">${esc(g.title)} ${esc(g.date)} <span class="hint">(${st})</span> `
      + `<button class="s" onclick="delGoal('${g.id}')">削除</button></div>`;
  });
  h += '</div>';

  h += '<div class="card"><h2>予定を追加(単発)</h2>'
    + `<div class="row"><input id="e-title" placeholder="タイトル" style="flex:1"></div>`
    + `<div class="row"><input id="e-date" type="date" value="${state.sel}"> <input id="e-time" type="time"></div>`
    + '<button class="p" onclick="addEvent()">追加</button></div>';

  h += '<div class="card"><h2>曜日ごとの予定(繰り返し)</h2>'
    + `<div class="row"><input id="r-title" placeholder="タイトル" style="flex:1"></div><div class="row">`;
  DOW.forEach((w, i) => { h += `<label><input type="checkbox" class="r-day" value="${i}">${w}</label> `; });
  h += '</div><div class="row"><input id="r-time" type="time"></div>'
    + '<div class="row">期間 <input id="r-from" type="date"> 〜 <input id="r-to" type="date"></div>'
    + '<div class="hint">期間は空欄なら無期限です。</div>'
    + '<button class="p" onclick="addRec()">追加</button></div>';

  h += '<div class="card"><h2>登録済みの繰り返し予定</h2>';
  if (!db.recurring.length) h += '<div class="hint">まだありません</div>';
  db.recurring.forEach(r => {
    h += `<div class="row">${esc(r.title)} ${r.days.map(d => DOW[d]).join('・')} `
      + `${esc(r.time || '')} ${r.from || ''}〜${r.to || ''} `
      + `<button class="s" onclick="delRec('${r.id}')">削除</button></div>`;
  });
  return h + '</div>';
}
function addGoal() {
  const title = $('#g-title').value.trim();
  const date = $('#g-date').value;
  if (!title || !date) { alert('目標と期限を入力してください'); return; }
  db.goals.push({ id: uid(), title, date });
  save();
  state.msg = '';
  render();
}
function addEvent() {
  const title = $('#e-title').value.trim();
  const date = $('#e-date').value;
  if (!title || !date) { alert('タイトルと日付を入力してください'); return; }
  db.events.push({ id: uid(), title, date, time: $('#e-time').value });
  save();
  state.sel = date;
  setTab('month');
}
function addRec() {
  const title = $('#r-title').value.trim();
  const days = [...document.querySelectorAll('.r-day:checked')].map(x => Number(x.value));
  if (!title || !days.length) { alert('タイトルと曜日を選んでください'); return; }
  db.recurring.push({
    id: uid(), title, days,
    time: $('#r-time').value, from: $('#r-from').value, to: $('#r-to').value
  });
  save();
  setTab('month');
}

// ---------- 取込・保存 ----------
const PROMPT = `目標達成のロードマップと、今日以降のやることを、次のJSON形式だけで出力してください(説明文は不要)。
{
  "roadmap": {"goal": "", "deadline": "YYYY-MM-DD", "milestones": [{"title": "", "due": "YYYY-MM-DD"}]},
  "tasks": [{"date": "YYYY-MM-DD", "title": "", "duration_min": 30}],
  "events": [{"date": "YYYY-MM-DD", "title": "", "time": "HH:MM"}]
}`;

function renderData() {
  let h = '<div class="card"><h2>AIからの取り込み</h2>'
    + '<div class="hint">AIに渡すプロンプト(コピーして使います)</div>'
    + `<textarea id="prompt" readonly style="min-height:110px">${esc(PROMPT)}</textarea>`
    + '<div class="row"><button class="s" onclick="copyText(\'#prompt\')">プロンプトをコピー</button></div>'
    + '<div class="hint">AIが出したJSONを貼り付けてください</div>'
    + '<textarea id="imp"></textarea>'
    + '<div class="row"><button class="p" onclick="previewImport()">プレビュー</button></div>';
  if (state.preview) {
    const p = state.preview;
    h += `<div class="hint">タスク ${p.tasks.length}件 / 予定 ${p.events.length}件 を取り込みます</div>`;
    if (p.goal) h += `<div class="hint">目標:${esc(p.goal.title)}(${esc(p.goal.date)})も登録します</div>`;
    h += '<ul>' + p.tasks.slice(0, 10).map(t => `<li>${esc(t.date)} ${esc(t.title)}</li>`).join('') + '</ul>';
    if (p.tasks.length > 10) h += '<div class="hint">…ほか省略</div>';
    h += '<button class="p" onclick="applyImport()">反映する</button>';
  }
  if (state.msg) h += `<div class="hint">${esc(state.msg)}</div>`;
  h += '</div>';

  h += '<div class="card"><h2>バックアップ</h2>'
    + '<div class="hint">書き出したテキストをメモ等に保存しておくと、復元できます。</div>'
    + '<div class="row"><button class="s" onclick="exportData()">書き出し</button>'
    + '<button class="s" onclick="importData()">貼り付けて復元</button></div>'
    + '<textarea id="bk"></textarea>'
    + '<div class="row"><button class="s" onclick="copyText(\'#bk\')">コピー</button></div></div>';
  return h;
}
function copyText(sel) {
  const el = $(sel);
  el.select();
  document.execCommand('copy');
}
function previewImport() {
  try {
    const j = JSON.parse($('#imp').value);
    const tasks = (j.tasks || []).filter(t => t.date && t.title);
    const events = (j.events || []).filter(e => e.date && e.title);
    const r = j.roadmap;
    const goal = (r && r.goal && r.deadline) ? { title: r.goal, date: r.deadline } : null;
    state.preview = { tasks, events, goal };
    state.msg = '';
  } catch (e) {
    state.preview = null;
    state.msg = 'JSONを読み取れませんでした: ' + e.message;
  }
  render();
}
function applyImport() {
  const p = state.preview;
  p.tasks.forEach(t => db.tasks.push({
    id: uid(), date: t.date, title: t.title, min: t.duration_min || 0, done: false, src: 'ai'
  }));
  p.events.forEach(e => db.events.push({ id: uid(), date: e.date, title: e.title, time: e.time || '' }));
  if (p.goal && !db.goals.some(g => g.title === p.goal.title && g.date === p.goal.date)) {
    db.goals.push({ id: uid(), title: p.goal.title, date: p.goal.date });
  }
  save();
  state.preview = null;
  state.msg = '取り込みました';
  render();
}
function exportData() { $('#bk').value = JSON.stringify(db); }
function importData() {
  try {
    const j = JSON.parse($('#bk').value);
    if (!j.logs || !j.events) throw new Error('形式が違います');
    if (!confirm('現在のデータを上書きして復元しますか?')) return;
    if (!j.picks) j.picks = {};
    if (!j.goals) j.goals = [];
    db = j;
    save();
    state.msg = '復元しました';
    render();
  } catch (e) {
    alert('復元できませんでした: ' + e.message);
  }
}

// ---------- 画面 ----------
function render() {
  const tabs = [['today', '今日'], ['month', '月'], ['add', '追加'], ['data', '取込・保存']];
  $('#nav').innerHTML = tabs.map(([k, v]) =>
    `<button class="${state.tab === k ? 'on' : ''}" onclick="setTab('${k}')">${v}</button>`
  ).join('');
  let h = '';
  if (state.tab === 'today') h = renderGoals() + renderTimerBox() + renderDay(todayStr);
  if (state.tab === 'month') h = renderMonth();
  if (state.tab === 'add') h = renderAdd();
  if (state.tab === 'data') h = renderData();
  $('#app').innerHTML = h;
  updateTimer();
}
render();
</script>
</body>
