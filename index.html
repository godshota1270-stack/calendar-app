<!-- File: index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="予定">
<title>予定</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    background: #f5f6f8;
    color: #222;
    padding-bottom: 80px;
  }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 17px; margin: 12px 0 8px; }
  h3 { font-size: 15px; margin: 14px 0 6px; }
  .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; font-size: 12px; color: #888; }
  .cell {
    background: #fff; border-radius: 8px; min-height: 54px; padding: 4px;
    font-size: 13px; position: relative; text-align: center;
  }
  .cell.today { border: 2px solid #e67e22; }
  .cell.sel { background: #e8f0fe; }
  .badge {
    display: block; margin: 2px auto 0; width: 20px; height: 20px;
    line-height: 20px; border-radius: 50%; font-size: 11px; color: #fff;
  }
  .tA { background: #2f7de1; }
  .tB { background: #2e9e5b; }
  .tP { background: #e8912d; }
  .plan { background: none; color: #999; border: 1px solid #bbb; line-height: 18px; }
  .dot {
    position: absolute; right: 4px; top: 4px;
    width: 6px; height: 6px; border-radius: 50%; background: #c0392b;
  }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex;
    background: #fff; border-top: 1px solid #ddd;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button { flex: 1; padding: 14px 0; border: 0; background: none; font-size: 14px; }
  nav button.on { color: #2f7de1; font-weight: bold; }
  input, textarea, select {
    font-size: 16px; padding: 8px; border: 1px solid #ccc;
    border-radius: 8px; max-width: 100%;
  }
  input.n { width: 64px; text-align: center; }
  textarea { width: 100%; min-height: 140px; }
  button.p { background: #2f7de1; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 15px; }
  button.s { background: #eee; border: 0; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .ex { border-top: 1px solid #eee; padding: 8px 0; }
  .hint { font-size: 12px; color: #888; }
  .up { font-size: 12px; color: #c0392b; }
  .done { text-decoration: line-through; color: #999; }
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const DOW = ['日', '月', '火', '水', '木', '金', '土'];

// ---------- データ ----------
const KEY = 'calendar-app-v1';
let db = JSON.parse(localStorage.getItem(KEY) || 'null')
  || { events: [], recurring: [], tasks: [], logs: {} };
const save = () => localStorage.setItem(KEY, JSON.stringify(db));

// ---------- 筋トレ定義(PDFの計画) ----------
// 曜日 0=日 ... 6=土
const WEEK = { 0: 'P', 1: 'P', 2: 'A', 3: 'R', 4: 'P', 5: 'B', 6: 'P' };
const TYPE_NAME = {
  A: 'Day A(大腿前部・プッシュ)',
  B: 'Day B(大腿後面・プル)',
  P: '調整日(軽めプランク)',
  R: '完全休養'
};
const EX = {
  A: [
    { id: 'squat', name: 'ゴブレットスクワット', w: 8, min: 8, max: 10, sets: 3, unit: '回', hasW: true },
    { id: 'press', name: 'ダンベルプレス(片手)', w: 6, min: 8, max: 10, sets: 3, unit: '回', hasW: true },
    { id: 'side', name: 'サイドレイズ(片手)', w: 2, min: 12, max: 15, sets: 3, unit: '回', hasW: true },
    { id: 'plankH', name: 'プランク(高強度)', w: 0, min: 30, max: 45, sets: 3, unit: '秒', hasW: false }
  ],
  B: [
    { id: 'rdl', name: 'ダンベルRDL(片手)', w: 6, min: 8, max: 10, sets: 3, unit: '回', hasW: true },
    { id: 'row', name: 'ベントオーバーロー(片手)', w: 5, min: 8, max: 10, sets: 3, unit: '回', hasW: true },
    { id: 'curl', name: 'アームカール(片手)', w: 4, min: 10, max: 12, sets: 3, unit: '回', hasW: true },
    { id: 'crunch', name: 'クランチ', w: 0, min: 12, max: 15, sets: 3, unit: '回', hasW: false }
  ],
  P: [
    { id: 'plankL', name: '軽めプランク', w: 0, min: 20, max: 30, sets: 2, unit: '秒', hasW: false }
  ],
  R: []
};

function lastLog(type, exId, before) {
  const dates = Object.keys(db.logs).filter(d => d < before && db.logs[d].type === type).sort();
  for (let i = dates.length - 1; i >= 0; i--) {
    const e = db.logs[dates[i]].ex && db.logs[dates[i]].ex[exId];
    if (e) return e;
  }
  return null;
}

// ---------- 予定の展開 ----------
function itemsOn(ds) {
  const dow = parse(ds).getDay();
  const events = db.events.filter(e => e.date === ds).map(e => ({ ...e, rec: false }));
  db.recurring.forEach(r => {
    if (!r.days.includes(dow)) return;
    if (r.from && ds < r.from) return;
    if (r.to && ds > r.to) return;
    events.push({ id: r.id, title: r.title, time: r.time, rec: true });
  });
  events.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  const tasks = db.tasks.filter(t => t.date === ds);
  return { events, tasks };
}

// ---------- 状態 ----------
const todayStr = ymd(new Date());
let state = { tab: 'today', month: new Date(), sel: todayStr, preview: null, msg: '' };

function setTab(t) { state.tab = t; state.msg = ''; render(); }
function moveMonth(n) {
  state.month = new Date(state.month.getFullYear(), state.month.getMonth() + n, 1);
  render();
}
function selectDate(ds) { state.sel = ds; render(); }

// ---------- 日の表示 ----------
function renderDay(ds) {
  const d = parse(ds);
  const type = WEEK[d.getDay()];
  const { events, tasks } = itemsOn(ds);
  let h = `<div class="card"><h2>${ds}(${DOW[d.getDay()]})</h2>`;

  h += '<h3>予定</h3>';
  if (!events.length) h += '<div class="hint">予定はありません</div>';
  events.forEach(e => {
    h += `<div class="row">${esc(e.time || '終日')} ${esc(e.title)}`
      + `${e.rec ? ' <span class="hint">(繰り返し)</span>' : ''}`
      + (e.rec ? '' : ` <button class="s" onclick="delEvent('${e.id}')">削除</button>`)
      + '</div>';
  });

  h += '<h3>今日やること</h3>';
  if (!tasks.length) h += '<div class="hint">タスクはありません</div>';
  tasks.forEach(t => {
    h += `<div class="row"><label class="${t.done ? 'done' : ''}">`
      + `<input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')"> `
      + `${esc(t.title)}${t.min ? `(${t.min}分)` : ''}</label>`
      + ` <button class="s" onclick="delTask('${t.id}')">削除</button></div>`;
  });

  h += `<h3>筋トレ:${TYPE_NAME[type]}</h3>`;
  const log = db.logs[ds];
  EX[type].forEach(ex => {
    const cur = log && log.ex && log.ex[ex.id];
    const prev = lastLog(type, ex.id, ds);
    const w = cur ? cur.w : (prev ? prev.w : ex.w);
    h += `<div class="ex"><b>${ex.name}</b> <span class="hint">${ex.sets}セット × ${ex.min}〜${ex.max}${ex.unit}</span>`;
    h += '<div class="row">';
    if (ex.hasW) {
      h += `<input class="n" id="w-${ex.id}" type="number" step="0.5" inputmode="decimal" value="${w}"> kg`;
    }
    for (let i = 0; i < ex.sets; i++) {
      const v = cur && cur.s[i] != null ? cur.s[i] : '';
      const ph = prev && prev.s[i] != null ? prev.s[i] : '';
      h += `<input class="n" id="s-${ex.id}-${i}" type="number" inputmode="numeric" value="${v}" placeholder="${ph}">`;
    }
    h += `<span class="hint">${ex.unit}</span></div>`;
    if (prev && prev.s.length >= ex.sets && prev.s.slice(0, ex.sets).every(x => Number(x) >= ex.max)) {
      h += '<div class="up">前回は全セットで上限に到達しました。フォームと余力に問題なければ、最小の刻みでの増量を検討してください。</div>';
    }
    h += '</div>';
  });
  if (type !== 'R') {
    h += `<div class="row"><input id="note" style="flex:1" placeholder="余力・フォーム・痛み・次回の調整" value="${esc(log && log.note || '')}"></div>`;
    h += `<div class="row"><button class="p" onclick="saveLog('${ds}')">記録を保存</button>`
      + (log ? ` <button class="s" onclick="delLog('${ds}')">記録を削除</button>` : '') + '</div>';
  }
  return h + '</div>';
}

function saveLog(ds) {
  const type = WEEK[parse(ds).getDay()];
  const ex = {};
  EX[type].forEach(e => {
    const w = e.hasW ? Number($('#w-' + e.id).value) : 0;
    const s = [];
    for (let i = 0; i < e.sets; i++) {
      const v = $(`#s-${e.id}-${i}`).value;
      s.push(v === '' ? null : Number(v));
    }
    if (s.some(x => x != null)) ex[e.id] = { w, s };
  });
  if (!Object.keys(ex).length) { alert('回数を1つ以上入力してください'); return; }
  db.logs[ds] = { type, ex, note: $('#note').value };
  save();
  render();
}
function delLog(ds) { if (confirm('この日の記録を削除しますか?')) { delete db.logs[ds]; save(); render(); } }
function toggleTask(id) { const t = db.tasks.find(x => x.id === id); t.done = !t.done; save(); render(); }
function delTask(id) { db.tasks = db.tasks.filter(x => x.id !== id); save(); render(); }
function delEvent(id) { db.events = db.events.filter(x => x.id !== id); save(); render(); }
function delRec(id) { db.recurring = db.recurring.filter(x => x.id !== id); save(); render(); }

// ---------- 月表示 ----------
function renderMonth() {
  const y = state.month.getFullYear();
  const m = state.month.getMonth();
  const first = new Date(y, m, 1);
  const last = new Date(y, m + 1, 0);
  let h = `<div class="bar"><button class="s" onclick="moveMonth(-1)">‹</button>`
    + `<b>${y}年${m + 1}月</b><button class="s" onclick="moveMonth(1)">›</button></div><div class="grid">`;
  DOW.forEach(w => { h += `<div class="dow">${w}</div>`; });
  for (let i = 0; i < first.getDay(); i++) h += '<div></div>';
  for (let day = 1; day <= last.getDate(); day++) {
    const dt = new Date(y, m, day);
    const ds = ymd(dt);
    const log = db.logs[ds];
    const planned = WEEK[dt.getDay()];
    let mark = '';
    if (log) mark = `<span class="badge t${log.type}">${log.type}</span>`;
    else if (planned === 'A' || planned === 'B') mark = `<span class="badge plan">${planned}</span>`;
    const it = itemsOn(ds);
    const dot = (it.events.length || it.tasks.length) ? '<i class="dot"></i>' : '';
    h += `<div class="cell ${ds === todayStr ? 'today' : ''} ${ds === state.sel ? 'sel' : ''}" `
      + `onclick="selectDate('${ds}')"><span>${day}</span>${mark}${dot}</div>`;
  }
  h += '</div>';
  h += '<div class="hint" style="margin:8px 0">塗りつぶし=実施済み / 枠のみ=予定日 / 赤点=予定・タスクあり</div>';
  return h + renderDay(state.sel);
}

// ---------- 追加 ----------
function renderAdd() {
  let h = '<div class="card"><h2>予定を追加(単発)</h2>'
    + `<div class="row"><input id="e-title" placeholder="タイトル" style="flex:1"></div>`
    + `<div class="row"><input id="e-date" type="date" value="${state.sel}"> <input id="e-time" type="time"></div>`
    + '<button class="p" onclick="addEvent()">追加</button></div>';

  h += '<div class="card"><h2>曜日ごとの予定(繰り返し)</h2>'
    + `<div class="row"><input id="r-title" placeholder="タイトル" style="flex:1"></div><div class="row">`;
  DOW.forEach((w, i) => { h += `<label><input type="checkbox" class="r-day" value="${i}">${w}</label> `; });
  h += '</div><div class="row"><input id="r-time" type="time"></div>'
    + '<div class="row">期間 <input id="r-from" type="date"> 〜 <input id="r-to" type="date"></div>'
    + '<div class="hint">期間は空欄なら無期限です。</div>'
    + '<button class="p" onclick="addRec()">追加</button></div>';

  h += '<div class="card"><h2>登録済みの繰り返し予定</h2>';
  if (!db.recurring.length) h += '<div class="hint">まだありません</div>';
  db.recurring.forEach(r => {
    h += `<div class="row">${esc(r.title)} ${r.days.map(d => DOW[d]).join('・')} `
      + `${esc(r.time || '')} ${r.from || ''}〜${r.to || ''} `
      + `<button class="s" onclick="delRec('${r.id}')">削除</button></div>`;
  });
  return h + '</div>';
}
function addEvent() {
  const title = $('#e-title').value.trim();
  const date = $('#e-date').value;
  if (!title || !date) { alert('タイトルと日付を入力してください'); return; }
  db.events.push({ id: uid(), title, date, time: $('#e-time').value });
  save();
  state.sel = date;
  setTab('month');
}
function addRec() {
  const title = $('#r-title').value.trim();
  const days = [...document.querySelectorAll('.r-day:checked')].map(x => Number(x.value));
  if (!title || !days.length) { alert('タイトルと曜日を選んでください'); return; }
  db.recurring.push({
    id: uid(), title, days,
    time: $('#r-time').value, from: $('#r-from').value, to: $('#r-to').value
  });
  save();
  setTab('month');
}

// ---------- 取込・保存 ----------
const PROMPT = `目標達成のロードマップと、今日以降のやることを、次のJSON形式だけで出力してください(説明文は不要)。
{
  "roadmap": {"goal": "", "deadline": "YYYY-MM-DD", "milestones": [{"title": "", "due": "YYYY-MM-DD"}]},
  "tasks": [{"date": "YYYY-MM-DD", "title": "", "duration_min": 30}],
  "events": [{"date": "YYYY-MM-DD", "title": "", "time": "HH:MM"}]
}`;

function renderData() {
  let h = '<div class="card"><h2>AIからの取り込み</h2>'
    + '<div class="hint">AIに渡すプロンプト(コピーして使います)</div>'
    + `<textarea id="prompt" readonly style="min-height:110px">${esc(PROMPT)}</textarea>`
    + '<div class="row"><button class="s" onclick="copyText(\'#prompt\')">プロンプトをコピー</button></div>'
    + '<div class="hint">AIが出したJSONを貼り付けてください</div>'
    + '<textarea id="imp"></textarea>'
    + '<div class="row"><button class="p" onclick="previewImport()">プレビュー</button></div>';
  if (state.preview) {
    const p = state.preview;
    h += `<div class="hint">タスク ${p.tasks.length}件 / 予定 ${p.events.length}件 を取り込みます</div>`;
    h += '<ul>' + p.tasks.slice(0, 10).map(t => `<li>${esc(t.date)} ${esc(t.title)}</li>`).join('') + '</ul>';
    if (p.tasks.length > 10) h += '<div class="hint">…ほか省略</div>';
    h += '<button class="p" onclick="applyImport()">反映する</button>';
  }
  if (state.msg) h += `<div class="hint">${esc(state.msg)}</div>`;
  h += '</div>';

  h += '<div class="card"><h2>バックアップ</h2>'
    + '<div class="hint">書き出したテキストをメモ等に保存しておくと、復元できます。</div>'
    + '<div class="row"><button class="s" onclick="exportData()">書き出し</button>'
    + '<button class="s" onclick="importData()">貼り付けて復元</button></div>'
    + '<textarea id="bk"></textarea>'
    + '<div class="row"><button class="s" onclick="copyText(\'#bk\')">コピー</button></div></div>';
  return h;
}
function copyText(sel) {
  const el = $(sel);
  el.select();
  document.execCommand('copy');
}
function previewImport() {
  try {
    const j = JSON.parse($('#imp').value);
    const tasks = (j.tasks || []).filter(t => t.date && t.title);
    const events = (j.events || []).filter(e => e.date && e.title);
    state.preview = { tasks, events };
    state.msg = '';
  } catch (e) {
    state.preview = null;
    state.msg = 'JSONを読み取れませんでした: ' + e.message;
  }
  render();
}
function applyImport() {
  const p = state.preview;
  p.tasks.forEach(t => db.tasks.push({
    id: uid(), date: t.date, title: t.title, min: t.duration_min || 0, done: false, src: 'ai'
  }));
  p.events.forEach(e => db.events.push({ id: uid(), date: e.date, title: e.title, time: e.time || '' }));
  save();
  state.preview = null;
  state.msg = '取り込みました';
  render();
}
function exportData() { $('#bk').value = JSON.stringify(db); }
function importData() {
  try {
    const j = JSON.parse($('#bk').value);
    if (!j.logs || !j.events) throw new Error('形式が違います');
    if (!confirm('現在のデータを上書きして復元しますか?')) return;
    db = j;
    save();
    state.msg = '復元しました';
    render();
  } catch (e) {
    alert('復元できませんでした: ' + e.message);
  }
}

// ---------- 画面 ----------
function render() {
  const tabs = [['today', '今日'], ['month', '月'], ['add', '追加'], ['data', '取込・保存']];
  $('#nav').innerHTML = tabs.map(([k, v]) =>
    `<button class="${state.tab === k ? 'on' : ''}" onclick="setTab('${k}')">${v}</button>`
  ).join('');
  let h = '';
  if (state.tab === 'today') h = renderDay(todayStr);
  if (state.tab === 'month') h = renderMonth();
  if (state.tab === 'add') h = renderAdd();
  if (state.tab === 'data') h = renderData();
  $('#app').innerHTML = h;
}
render();
</script>
</body>
</html>
